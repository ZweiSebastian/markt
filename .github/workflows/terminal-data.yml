name: Terminal-Daten

on:
  schedule:
    # US-Handelszeit alle 30 Min., sonst morgens und abends
    - cron: '7,37 13-21 * * 1-5'
    - cron: '23 5,23 * * *'
  workflow_dispatch:
  push:
    branches: [main, terminal-dev]
    paths:
      - 'terminal/*.py'
      - '.github/workflows/terminal-data.yml'

permissions:
  contents: write

concurrency:
  group: terminal-daten
  cancel-in-progress: false

jobs:
  daten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pakete
        run: pip install -q pandas xlrd openpyxl requests yfinance
      - name: Daten sammeln
        env:
          DATA_BRANCH: ${{ github.ref_name == 'main' && 'terminal-data' || 'terminal-data-dev' }}
        run: |
          set -o pipefail
          mkdir -p out; python terminal/build_data.py | tee out/log.txt || python terminal/build_data.py | tee out/log.txt
          (grep '^FEHL' out/log.txt || true) | while IFS= read -r l; do echo "::warning::$l"; done
      - name: Auf Daten-Branch schreiben
        env:
          DATA_BRANCH: ${{ github.ref_name == 'main' && 'terminal-data' || 'terminal-data-dev' }}
        run: |
          cd out
          git init -q -b "$DATA_BRANCH"
          git config user.name "markt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add terminal.json full.json log.txt
          git commit -q -m "Terminal-Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$DATA_BRANCH"
