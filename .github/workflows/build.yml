name: APK bauen

on:
  push:
    paths-ignore:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/update-data.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk Markt.apk

      - name: Fehler anzeigen
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Signatur anzeigen
        run: |
          "$(ls -d $ANDROID_HOME/build-tools/* | tail -1)/apksigner" verify --print-certs *.apk | grep SHA-256 | while IFS= read -r l; do echo "::notice::$l"; done

      - name: Als Download ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Markt-apk
          path: Markt.apk

      - name: Release mit APK erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Markt ${{ github.run_number }}
          files: Markt.apk
