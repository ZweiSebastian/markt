name: probe
on:
  push:
    paths: ['scripts/probe_tr.py', '.github/workflows/probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pandas xlrd requests yfinance && python scripts/probe_tr.py
