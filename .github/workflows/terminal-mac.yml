name: Mac-App bauen

on:
  push:
    branches: [main]
    paths:
      - 'mac/**'
      - '.github/workflows/terminal-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Kompilieren (Apple Silicon + Intel)
        run: |
          set -e
          mkdir -p build
          swiftc -O -target arm64-apple-macos12 -o build/arm64 mac/App/main.swift -framework Cocoa -framework WebKit 2>&1 | tee build/swift.log
          swiftc -O -target x86_64-apple-macos12 -o build/x86 mac/App/main.swift -framework Cocoa -framework WebKit
          lipo -create build/arm64 build/x86 -output build/MarktTerminal

      - name: Fehler anzeigen
        if: failure()
        run: grep -E "error:" -A3 build/swift.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: App-Paket bauen
        run: |
          set -e
          APP="build/Markt Terminal.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/web"
          cp build/MarktTerminal "$APP/Contents/MacOS/"
          sed "s/__BUILD__/${{ github.run_number }}/g" mac/App/Info.plist > "$APP/Contents/Info.plist"
          cp mac/web/* "$APP/Contents/Resources/web/"
          # Icon
          mkdir -p build/AppIcon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s mac/App/icon.png --out build/AppIcon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d mac/App/icon.png --out build/AppIcon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns build/AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          cd build && ditto -c -k --sequesterRsrc --keepParent "Markt Terminal.app" MarktTerminal-mac.zip
          ls -la

      - name: Als Download ablegen
        uses: actions/upload-artifact@v4
        with:
          name: MarktTerminal-mac
          path: build/MarktTerminal-mac.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-${{ github.run_number }}
          name: Markt Terminal (Mac) ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: build/MarktTerminal-mac.zip
