name: terminal-research
on:
  push:
    branches: [terminal-dev]
    paths: ['.github/workflows/terminal-research.yml']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out && cd out
          curl -sSL -m 90 -o z1_row_eq_flow.json "https://api.db.nomics.world/v22/series/FED/Z1/FA263064105.Q?observations=1&format=json" || true
          curl -sSL -m 90 -o z1_row_eq_flow_nsa.json "https://api.db.nomics.world/v22/series/FED/Z1/FU263064105.Q?observations=1&format=json" || true
          curl -sSL -m 90 -o z1_row_eq_level.json "https://api.db.nomics.world/v22/series/FED/Z1/LM263064105.Q?observations=1&format=json" || true
          curl -sSL -m 90 -o z1_gdp.json "https://api.db.nomics.world/v22/series/FED/Z1/FA086902005.Q?observations=1&format=json" || true
          curl -sSL -m 90 -o oecd_fr.json "https://api.db.nomics.world/v22/series/OECD/MEI/FRA.IRLTLT01.ST.M?observations=1&format=json" || true
          curl -sSL -m 90 -o oecd_de.json "https://api.db.nomics.world/v22/series/OECD/MEI/DEU.IRLTLT01.ST.M?observations=1&format=json" || true
          curl -sSL -m 90 -o oecd_gb.json "https://api.db.nomics.world/v22/series/OECD/MEI/GBR.IRLTLT01.ST.M?observations=1&format=json" || true
          curl -sSL -m 90 -o oecd_it.json "https://api.db.nomics.world/v22/series/OECD/MEI/ITA.IRLTLT01.ST.M?observations=1&format=json" || true
          curl -sSL -m 90 -o oecd_jp.json "https://api.db.nomics.world/v22/series/OECD/MEI/JPN.IRLTLT01.ST.M?observations=1&format=json" || true
          curl -sSL -m 90 -o oecd_us.json "https://api.db.nomics.world/v22/series/OECD/MEI/USA.IRLTLT01.ST.M?observations=1&format=json" || true
          curl -sSL -m 90 -o oecdk_fr.json "https://api.db.nomics.world/v22/series/OECD/DSD_STES@DF_FINMARK/FRA.M.IRLT.PA._Z._Z._Z._Z.N?observations=1&format=json" || true
          curl -sSL -m 90 -o oecdk_de.json "https://api.db.nomics.world/v22/series/OECD/DSD_STES@DF_FINMARK/DEU.M.IRLT.PA._Z._Z._Z._Z.N?observations=1&format=json" || true
          curl -sSL -m 90 -o oecdk_gb.json "https://api.db.nomics.world/v22/series/OECD/DSD_STES@DF_FINMARK/GBR.M.IRLT.PA._Z._Z._Z._Z.N?observations=1&format=json" || true
          curl -sSL -m 90 -o oecdk_it.json "https://api.db.nomics.world/v22/series/OECD/DSD_STES@DF_FINMARK/ITA.M.IRLT.PA._Z._Z._Z._Z.N?observations=1&format=json" || true
          curl -sSL -m 90 -o ecb_fr.csv "https://data-api.ecb.europa.eu/service/data/IRS/M.FR.L.L40.CI.0000.EUR.N.Z?startPeriod=1980-01&format=csvdata" || true
          curl -sSL -m 90 -o ecb_de.csv "https://data-api.ecb.europa.eu/service/data/IRS/M.DE.L.L40.CI.0000.EUR.N.Z?startPeriod=1980-01&format=csvdata" || true
          curl -sSL -m 90 -o ecb_it.csv "https://data-api.ecb.europa.eu/service/data/IRS/M.IT.L.L40.CI.0000.EUR.N.Z?startPeriod=1980-01&format=csvdata" || true
          curl -sSL -m 90 -o tic_s1.txt "https://ticdata.treasury.gov/resource-center/data-chart-center/tic/Documents/s1_globl.txt" || true
          curl -sSL -m 90 -o tic_hist.csv "https://ticdata.treasury.gov/Publish/s1_globl.txt" || true
          ls -la > files.txt 2>&1; set -e
          git init -q -b research-flows
          git config user.name "markt-bot"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "flows" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-flows
