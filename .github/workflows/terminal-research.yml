name: terminal-research
on:
  push:
    branches: [terminal-dev]
    paths: ['.github/workflows/terminal-research.yml']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out && cd out
          curl -sSL -m 90 -o b_M.USD.DEM.AA.AC.A01.json "https://api.db.nomics.world/v22/series/BUBA/BBEX3/M.USD.DEM.AA.AC.A01?observations=1&format=json"
          curl -sSL -m 90 -o b_M.DEM.USD.AA.AC.A01.json "https://api.db.nomics.world/v22/series/BUBA/BBEX3/M.DEM.USD.AA.AC.A01?observations=1&format=json"
          curl -sSL -m 90 -o b_M.USD.DEM.CA.AC.A01.json "https://api.db.nomics.world/v22/series/BUBA/BBEX3/M.USD.DEM.CA.AC.A01?observations=1&format=json"
          curl -sSL -m 90 -o b_M.DEM.USD.CA.AC.A01.json "https://api.db.nomics.world/v22/series/BUBA/BBEX3/M.DEM.USD.CA.AC.A01?observations=1&format=json"
          curl -sSL -m 90 -o b_M.USD.DEM.EA.AC.A01.json "https://api.db.nomics.world/v22/series/BUBA/BBEX3/M.USD.DEM.EA.AC.A01?observations=1&format=json"
          curl -sSL -m 90 -o b_M.DEM.USD.EA.AC.A01.json "https://api.db.nomics.world/v22/series/BUBA/BBEX3/M.DEM.USD.EA.AC.A01?observations=1&format=json"
          curl -sSL -m 90 -o b_M.USD.DEM.AA.AC.A02.json "https://api.db.nomics.world/v22/series/BUBA/BBEX3/M.USD.DEM.AA.AC.A02?observations=1&format=json"
          curl -sSL -m 90 -o bq.json "https://api.db.nomics.world/v22/series/BUBA/BBEX3?dimensions=%7B%22BBK_STD_CURRENCY%22%3A%5B%22USD%22%5D%2C%22BBK_STD_FREQ%22%3A%5B%22M%22%5D%7D&observations=0&format=json&limit=50"
          ls -la > files.txt 2>&1; set -e
          git init -q -b research-flows5
          git config user.name "markt-bot"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "gold2" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-flows5
