name: terminal-research
on:
  push:
    branches: [terminal-dev]
    paths: ['.github/workflows/terminal-research.yml']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out && cd out
          curl -sSL -m 90 -o m2.json "https://api.db.nomics.world/v22/series/FED/H6_H6_M2?limit=50&observations=1" || true
          curl -sSL -m 90 -o m1.json "https://api.db.nomics.world/v22/series/FED/H6_H6_MBASE?limit=20&observations=1" || true
          ls -la > files.txt 2>&1; set -e
          git init -q -b research-m2
          git config user.name "markt-bot"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "M2" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-m2
