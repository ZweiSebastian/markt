name: terminal-research
on:
  push:
    branches: [terminal-dev]
    paths: ['.github/workflows/terminal-research.yml']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out && cd out
          curl -sSL -m 90 -o buba.json "https://api.db.nomics.world/v22/series/BUBA/BBEX3?q=gold&observations=1&format=json&limit=20"
          curl -sSL -m 90 -o insee.json "https://api.db.nomics.world/v22/series/INSEE/IPPMP?q=or&observations=1&format=json&limit=20"
          curl -sSL -m 90 -o ifs.json "https://api.db.nomics.world/v22/series/IMF/IFS?q=gold%20price&observations=1&format=json&limit=20"
          curl -sSL -m 90 -o tgb.json "https://api.db.nomics.world/v22/series/TGB/monthly?observations=1&format=json&limit=20"
          ls -la > files.txt 2>&1; set -e
          git init -q -b research-flows3
          git config user.name "markt-bot"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "gold2" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-flows3
