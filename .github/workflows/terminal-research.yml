name: terminal-research
on:
  push:
    branches: [terminal-dev]
    paths: ['.github/workflows/terminal-research.yml']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out && cd out
          for c in US DE XM; do for t in R N; do for b in N B; do curl -sSL -m 90 -o bis_${t}${b}_$c.json "https://api.db.nomics.world/v22/series/BIS/WS_EER/M.$t.$b.$c?observations=1&format=json"; done; done; done
          curl -sSL -m 90 -o buba_eurusd.json "https://api.db.nomics.world/v22/series/BUBA/BBEX3/M.USD.EUR.BB.AC.A02?observations=1&format=json"
          curl -sSL -m 90 -o buba_usddem.json "https://api.db.nomics.world/v22/series/BUBA/BBEX3/M.USD.DEM.AA.AC.A02?observations=1&format=json"
          curl -sSL -m 90 -o oecd_ppp.json "https://api.db.nomics.world/v22/series/OECD/SNA_TABLE4?dimensions=%7B%22LOCATION%22%3A%5B%22DEU%22%2C%22EA19%22%5D%2C%22TRANSACT%22%3A%5B%22PPPGDP%22%5D%7D&observations=1&format=json"
          ls -la > files.txt 2>&1; set -e
          git init -q -b research-fx
          git config user.name "markt-bot"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "fx" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-fx
