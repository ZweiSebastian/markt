name: terminal-research
on:
  push:
    branches: [terminal-dev]
    paths: ['.github/workflows/terminal-research.yml']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out && cd out
          for c in USA JPN CAN DEU FRA GBR ITA; do curl -sSL -m 90 -o oecdk_$c.json "https://api.db.nomics.world/v22/series/OECD/DSD_STES@DF_FINMARK/$c.M.IRLT.PA._Z._Z._Z._Z.N?observations=1&format=json"; done
          curl -sSL -m 90 -o bbk_gold_usd.csv "https://api.statistiken.bundesbank.de/rest/data/BBEX3/D.XAU.USD.EA.AC.C04?format=csv&lang=en"
          curl -sSL -m 90 -o bbk_gold_eur.csv "https://api.statistiken.bundesbank.de/rest/data/BBEX3/D.XAU.EUR.EA.AC.C04?format=csv&lang=en"
          curl -sSL -m 90 -o search_gold.json "https://api.db.nomics.world/v22/search?q=gold%20price%20monthly&limit=30"
          curl -sSL -m 90 -o wb_gold.json "https://api.db.nomics.world/v22/series/WB/commodity_prices/GOLD-1W?observations=1&format=json"
          curl -sSL -m 90 -o imf_gold.json "https://api.db.nomics.world/v22/series/IMF/PCPS/M.W00.PGOLD.USD?observations=1&format=json"
          ls -la > files.txt 2>&1; set -e
          git init -q -b research-flows2
          git config user.name "markt-bot"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "gold" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-flows2
