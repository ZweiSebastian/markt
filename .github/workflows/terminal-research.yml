name: terminal-research
on:
  push:
    branches: [terminal-dev]
    paths: ['.github/workflows/terminal-research.yml']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          B=https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp
          for f in F-F_Research_Data_Factors_daily_CSV F-F_Research_Data_Factors_CSV 49_Industry_Portfolios_daily_CSV 49_Industry_Portfolios_CSV Portfolios_Formed_on_ME_daily_CSV Portfolios_Formed_on_ME_CSV 10_Industry_Portfolios_daily_CSV; do
            curl -sSfL --retry 3 -m 120 -o $f.zip "$B/$f.zip" && echo "ok $f" || echo "FEHL $f"
          done
          ls -la
          git init -q -b research-ff
          git config user.name "markt-bot"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "French-Daten" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-ff
