name: terminal-research
on:
  push:
    branches: [terminal-dev]
    paths: ['.github/workflows/terminal-research.yml']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out && cd out
          B="https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp"
          for f in F-F_Research_Data_5_Factors_2x3 F-F_Momentum_Factor Portfolios_Formed_on_BE-ME Portfolios_Formed_on_OP Portfolios_Formed_on_INV Portfolios_Formed_on_D-P Portfolios_Formed_on_VAR Portfolios_Formed_on_E-P Portfolios_Formed_on_CF-P 10_Portfolios_Prior_12_2 Portfolios_Formed_on_ME Developed_5_Factors Developed_Mom_Factor Developed_6_Portfolios_ME_BE-ME Developed_6_Portfolios_ME_OP Developed_6_Portfolios_ME_INV Developed_6_Portfolios_ME_Prior_12_2 Developed_25_Portfolios_BE-ME_Prior_12_2 25_Portfolios_BEME_Prior_12_2 25_Portfolios_BEME_OP_5x5 Developed_25_Portfolios_BE-ME_OP_5x5; do
            curl -sSL -m 90 -A "Mozilla/5.0" -o $f.zip "$B/${f}_CSV.zip"; sleep 1; done
          curl -sSL -m 90 -A "Mozilla/5.0" -o aqr_qmj.xlsx "https://www.aqr.com/-/media/AQR/Documents/Insights/Data-Sets/Quality-Minus-Junk-Factors-Monthly.xlsx"
          ls -la > files.txt 2>&1; set -e
          git init -q -b research-r5
          git config user.name "markt-bot"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m r5 && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-r5
