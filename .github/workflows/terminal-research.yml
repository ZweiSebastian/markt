name: terminal-research
on:
  push:
    branches: [terminal-dev]
    paths: ['.github/workflows/terminal-research.yml']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out && cd out
          for s in NCBEILQ027S FBCELLQ027S TLBSNNCB TLBSNNB CMDEBT FGSDODNS SLGSDODNS DODFFSWCMI HNOCEAQ027S HNOMFAQ027S TFAABSHNO BOGZ1FL153064105Q BOGZ1FL153064205Q BOGZ1FL154090005Q BOGZ1FL153067005Q BOGZ1LM153064105Q BOGZ1LM153064205Q; do
            curl -sSL -m 60 -o "fred_$s.csv" -w "$s %{http_code}\n" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$s" >> codes.txt
          done
          for s in FL153064105 FL153064205 FL154090005 LM153064105 LM153064205 FL893064105 LM893064105 FL384104005 LM103164103 LM793164105; do
            curl -sSL -m 90 -o "z_$s.json" -w "z $s %{http_code}\n" "https://api.db.nomics.world/v22/series/FED/Z1/$s.Q?observations=1&format=json" >> codes.txt
          done
          for f in fred_*.csv; do echo "== $f $(wc -l < $f) $(head -2 $f | tail -1) $(tail -1 $f)"; done > heads.txt
          set -e
          git init -q -b research-r9
          git config user.name "markt-bot"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m r9 && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-r9
