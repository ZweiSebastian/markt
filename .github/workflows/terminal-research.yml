name: terminal-research
on:
  push:
    branches: [terminal-dev]
    paths: ['.github/workflows/terminal-research.yml']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out && cd out
          curl -sSL -m 120 -o slt_table4.txt "https://ticdata.treasury.gov/resource-center/data-chart-center/tic/Documents/slt_table4.txt"
          [ -s slt_table4.txt ] || curl -sSL -m 120 -o slt_table4.txt "https://treasury.gov/resource-center/data-chart-center/tic/Documents/slt_table4.txt"
          curl -sSL -m 120 -o stksect.txt "https://ticdata.treasury.gov/resource-center/data-chart-center/tic/Documents/stksect.txt"
          ls -la > files.txt 2>&1; set -e
          git init -q -b research-tic
          git config user.name "markt-bot"; git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "tic" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-tic
