name: terminal-probe
on:
  push:
    branches: [terminal-dev]
    paths: ['terminal/probe.py', '.github/workflows/terminal-probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python terminal/probe.py > terminal/probe.txt 2>&1 || true
      - run: |
          git config user.name "markt-bot"; git config user.email "actions@users.noreply.github.com"
          git add terminal/probe.txt && git commit -m "probe" && git push
